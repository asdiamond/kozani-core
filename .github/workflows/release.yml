name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

env:
  VSCODE_ARCH: arm64
  NPM_ARCH: arm64

jobs:
  build-macos:
    name: Build macOS ARM64
    runs-on: macos-14-xlarge
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Extract version from tag (v1.0.0 -> 1.0.0)
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          COMMIT="${GITHUB_SHA:0:10}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "Building version $VERSION (commit $COMMIT)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Prepare node_modules cache key
        run: |
          mkdir -p .build
          node build/azure-pipelines/common/computeNodeModulesCacheKey.ts darwin $VSCODE_ARCH $(node -p process.arch) > .build/packagelockhash

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache/restore@v4
        with:
          path: .build/node_modules_cache
          key: "node_modules-macos-${{ hashFiles('.build/packagelockhash') }}"

      - name: Extract node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        run: tar -xzf .build/node_modules_cache/cache.tgz

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e
          python3 -m pip install --break-system-packages setuptools

          for i in {1..5}; do
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GYP_DEFINES: "kerberos_use_rtld=false"

      - name: Create node_modules archive
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e
          node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt
          mkdir -p .build/node_modules_cache
          tar -czf .build/node_modules_cache/cache.tgz --files-from .build/node_modules_list.txt

      - name: Save node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/node_modules_cache
          key: "node_modules-macos-${{ hashFiles('.build/packagelockhash') }}"

      - name: Prepare built-in extensions cache key
        run: |
          mkdir -p .build
          node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash

      - name: Restore built-in extensions cache
        id: cache-builtin-extensions
        uses: actions/cache/restore@v4
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: "builtin-extensions-${{ hashFiles('.build/builtindepshash') }}"

      - name: Download built-in extensions
        if: steps.cache-builtin-extensions.outputs.cache-hit != 'true'
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save built-in extensions cache
        if: steps.cache-builtin-extensions.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: "builtin-extensions-${{ hashFiles('.build/builtindepshash') }}"

      - name: Install and compile kozani-ext
        run: |
          cd extensions/kozani-ext
          npm install
          npm run compile

      - name: Download Electron
        run: |
          set -e
          for i in {1..3}; do
            npm run electron -- $VSCODE_ARCH && break
            if [ $i -eq 3 ]; then
              echo "Electron download failed after 3 attempts" >&2
              exit 1
            fi
            echo "Electron download failed on attempt $i, retrying..."
            sleep 5
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build client
        run: npm run gulp vscode-darwin-$VSCODE_ARCH-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package as zip
        id: package
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          COMMIT="${{ steps.version.outputs.commit }}"

          APP_ROOT="../VSCode-darwin-$VSCODE_ARCH"
          ZIP_NAME="kozani-darwin-arm64-${VERSION}-${COMMIT}.zip"

          cd "$APP_ROOT"
          zip -r -y "$ZIP_NAME" ./*
          mv "$ZIP_NAME" "$GITHUB_WORKSPACE/"

          # Calculate SHA256
          SHA256=$(shasum -a 256 "$GITHUB_WORKSPACE/$ZIP_NAME" | cut -d ' ' -f 1)

          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "Built $ZIP_NAME with SHA256: $SHA256"

      - name: Create DMG installer
        id: dmg
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          COMMIT="${{ steps.version.outputs.commit }}"

          APP_ROOT="../VSCode-darwin-$VSCODE_ARCH"
          APP_NAME="Kozani.app"
          DMG_NAME="Kozani-${VERSION}-arm64.dmg"
          VOLUME_NAME="Kozani"

          # Create a temporary directory for DMG contents
          DMG_TEMP="dmg_temp"
          mkdir -p "$DMG_TEMP"

          # Copy the app to the temp directory
          cp -R "$APP_ROOT/$APP_NAME" "$DMG_TEMP/"

          # Create a symlink to Applications
          ln -s /Applications "$DMG_TEMP/Applications"

          # Create the DMG
          hdiutil create -volname "$VOLUME_NAME" \
            -srcfolder "$DMG_TEMP" \
            -ov -format UDZO \
            "$GITHUB_WORKSPACE/$DMG_NAME"

          # Cleanup
          rm -rf "$DMG_TEMP"

          # Calculate SHA256
          DMG_SHA256=$(shasum -a 256 "$GITHUB_WORKSPACE/$DMG_NAME" | cut -d ' ' -f 1)

          echo "dmg_name=$DMG_NAME" >> $GITHUB_OUTPUT
          echo "dmg_sha256=$DMG_SHA256" >> $GITHUB_OUTPUT
          echo "Built $DMG_NAME with SHA256: $DMG_SHA256"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: kozani-darwin-arm64-zip
          path: ${{ steps.package.outputs.zip_name }}
          retention-days: 30

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: kozani-darwin-arm64-dmg
          path: ${{ steps.dmg.outputs.dmg_name }}
          retention-days: 30

  upload-release:
    name: Upload to S3
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download zip artifact
        uses: actions/download-artifact@v4
        with:
          name: kozani-darwin-arm64-zip

      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: kozani-darwin-arm64-dmg

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Upload to S3
        env:
          VERSION: ${{ needs.build-macos.outputs.version }}
          COMMIT: ${{ needs.build-macos.outputs.commit }}
        run: |
          set -e
          ZIP_NAME="kozani-darwin-arm64-${VERSION}-${COMMIT}.zip"
          DMG_NAME="Kozani-${VERSION}-arm64.dmg"
          BUCKET="kozani-updates"

          # Upload the zip file (used for auto-updates)
          aws s3 cp "$ZIP_NAME" "s3://${BUCKET}/releases/darwin-arm64/${ZIP_NAME}"

          # Upload the DMG file (used for manual downloads)
          aws s3 cp "$DMG_NAME" "s3://${BUCKET}/releases/darwin-arm64/${DMG_NAME}"

          # Calculate SHA256 for both
          ZIP_SHA256=$(sha256sum "$ZIP_NAME" | cut -d ' ' -f 1)
          DMG_SHA256=$(sha256sum "$DMG_NAME" | cut -d ' ' -f 1)

          # Create/update latest.json
          ZIP_URL="https://${BUCKET}.s3.amazonaws.com/releases/darwin-arm64/${ZIP_NAME}"
          DMG_URL="https://${BUCKET}.s3.amazonaws.com/releases/darwin-arm64/${DMG_NAME}"

          # Try to get existing latest.json, or start with empty object
          aws s3 cp "s3://${BUCKET}/releases/latest.json" latest.json 2>/dev/null || echo '{}' > latest.json

          # Update with new release info using jq
          cat latest.json | jq --arg version "$GITHUB_SHA" \
                               --arg productVersion "$VERSION" \
                               --arg url "$ZIP_URL" \
                               --arg sha256hash "$ZIP_SHA256" \
                               --arg dmgUrl "$DMG_URL" \
                               --arg dmgSha256 "$DMG_SHA256" \
                               '."darwin-arm64" = {
                                  "version": $version,
                                  "productVersion": $productVersion,
                                  "url": $url,
                                  "sha256hash": $sha256hash,
                                  "dmgUrl": $dmgUrl,
                                  "dmgSha256": $dmgSha256
                                }' > latest_updated.json

          # Upload updated manifest
          aws s3 cp latest_updated.json "s3://${BUCKET}/releases/latest.json" \
            --content-type "application/json"

          echo "Release uploaded successfully!"
          echo "Zip URL: $ZIP_URL"
          echo "DMG URL: $DMG_URL"
          cat latest_updated.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            kozani-darwin-arm64-*.zip
            Kozani-*-arm64.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
